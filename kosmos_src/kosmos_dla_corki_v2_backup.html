<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#020611">
<title>Mój Kosmos</title>
<style>
:root{color-scheme:dark;--blue:#40b8ff;--gold:#ffd95a;--panel:rgba(5,16,36,.92);--line:rgba(110,180,255,.38)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020611;color:#f2f8ff;font-family:ui-rounded,"Nunito","Baloo 2",Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none}
canvas{display:block}
#space{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer}
.top{position:absolute;top:16px;left:18px;display:flex;align-items:center;gap:12px;pointer-events:none;text-shadow:0 2px 18px #000}
.logo{width:50px;height:50px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-size:28px;box-shadow:0 0 24px #ffb43a66;flex:none}
h1{font-size:clamp(22px,2.6vw,30px);margin:0;font-weight:800;letter-spacing:-.3px;line-height:1.1}
.sub{font-size:14px;color:#ffe9a8;margin-top:3px;font-weight:600}
.notebook{margin-left:8px;padding:8px 14px;border-radius:999px;background:rgba(5,16,36,.88);border:1px solid var(--line);color:#cfe6ff;font-weight:700;font-size:15px;white-space:nowrap;text-shadow:none}
.panel{position:absolute;background:var(--panel);border:1px solid var(--line);box-shadow:0 14px 50px #0009,inset 0 1px #ffffff10;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:22px}
.dock{display:contents}
.info{right:18px;top:18px;width:min(380px,calc(100vw - 36px));padding:18px;max-height:calc(100vh - 130px);overflow:auto}
.infohead{display:flex;align-items:center;gap:14px}
.planet-icon{width:64px;height:64px;border-radius:50%;flex:none;box-shadow:inset -10px -6px 14px #0009,0 0 20px #ffb43a33;display:grid;place-items:center;font-size:30px}
.infotext{min-width:0}
.info h2{font-size:28px;margin:0;line-height:1.1;font-weight:800}
.muted{color:#b9d0ee;font-size:14px;margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{background:#0b2a4d;border:1px solid #2f6aa8;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700}
.chip.hint{border-color:var(--gold);color:var(--gold)}
.factbox{margin-top:14px;padding:14px 16px;border-radius:18px;background:linear-gradient(160deg,#112d55,#0a1c38);border:1px solid #2f6aa8}
.factlabel{font-size:13px;color:var(--gold);font-weight:800;margin-bottom:6px}
.fact{font-size:19px;line-height:1.4;font-weight:700;margin:0;min-height:calc(1.4em * 5)}
.fact.pop{animation:pop .35s}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dots{display:flex;gap:6px;margin-top:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:#2d4f78}
.dots i.on{background:var(--gold)}
.row{display:flex;gap:8px;margin-top:12px}
button{font:inherit;color:#f2f8ff;border:2px solid #3a78b8;background:#08203c;border-radius:16px;cursor:pointer;transition:.12s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:hover{border-color:var(--blue);background:#0c335c}
button:active{transform:scale(.96)}
button.active{background:#0b4a80;border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,217,90,.3)}
.btn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;padding:6px 8px;font-size:13px;font-weight:700;line-height:1.15}
.row.facts{flex-wrap:wrap}
#activityBtn{flex:1 1 100%}
.btn .ico{font-size:24px;line-height:1}
.btn.wide{flex-direction:row;gap:8px;font-size:15px}
.btn.wide .ico{font-size:21px}
.controls{left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:8px;padding:10px;border-radius:24px}
.controls .btn{width:88px;flex:none}
.activity{position:fixed;inset:0;background:rgba(2,6,17,.82);z-index:20;overflow:auto;padding:16px;display:grid;align-items:start;justify-items:center}
.activity .card{width:min(620px,100%);margin:auto;padding:16px;border-radius:24px;background:linear-gradient(160deg,#102a52,#0a1c38);border:2px solid #2f6aa8;box-shadow:0 0 60px #000}
.acthead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.acthead h2{margin:0;font-size:24px}
.acthead button{width:48px;height:48px;font-size:20px;flex:none}
.actlead{margin:10px 0 12px;font-size:17px;line-height:1.4;font-weight:600;color:#d8e8ff}
#actCanvas{width:auto;height:auto;max-width:100%;max-height:calc(100vh - 230px);margin:0 auto;border-radius:16px;touch-action:none;background:#000;cursor:crosshair}
.actlog{margin-top:12px}
.actlog p{margin:0 0 10px;padding:10px 14px;border-radius:14px;background:#0b2a4d;border:1px solid #2f6aa8;font-size:16px;line-height:1.4;font-weight:600;animation:pop .35s}

@media (max-width:1200px){
 .top{top:12px;left:14px}
 .logo{width:40px;height:40px;font-size:22px}
 h1{font-size:21px}
 .sub{font-size:12px}
 .notebook{font-size:12px;padding:5px 10px;margin-left:4px}
 .dock{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"info" "controls";gap:8px;pointer-events:none}
 .dock>.panel{position:static;transform:none;width:auto;pointer-events:auto}
 .info{grid-area:info;padding:12px;max-height:none;border-radius:20px}
 .planet-icon{width:48px;height:48px;font-size:24px}
 .info h2{font-size:22px}
 .muted{font-size:12px}
 .chips{margin-top:10px;gap:6px}
 .chip{font-size:12px;padding:4px 9px}
 .factbox{margin-top:10px;padding:10px 12px}
 .factlabel{font-size:12px;margin-bottom:4px}
 .fact{font-size:16px;min-height:calc(1.4em * 4)}
 .dots{display:none}
 .row{margin-top:8px}
 .btn{min-height:50px;font-size:12px}
 .row.facts{flex-wrap:nowrap}
 #activityBtn{flex:1 1 0}
 .btn.wide{flex-direction:column;font-size:12px;gap:2px;padding:4px}
 .btn.wide .ico{font-size:20px}
 .controls{grid-area:controls;display:grid;grid-template-columns:repeat(6,1fr);padding:8px;gap:6px;border-radius:20px}
 .controls .btn{width:auto;min-height:54px;padding:4px 2px;font-size:11px}
 .controls .btn .ico{font-size:22px}
}
@media (max-width:700px) and (max-height:780px){
 .chips{display:none}
}
@media (max-width:1200px) and (max-height:520px) and (orientation:landscape){
 .dock{left:auto;width:min(400px,52vw);top:10px;align-content:end}
 .info{max-height:calc(100vh - 92px);overflow:auto;padding:8px 12px}
 .chips{display:none}
 .planet-icon{width:34px;height:34px;font-size:18px}
 .info h2{font-size:19px}
 .muted{font-size:11px}
 .factbox{margin-top:6px;padding:8px 12px}
 .factlabel{margin-bottom:2px}
 .fact{font-size:14px;min-height:calc(1.35em * 3)}
 .row{margin-top:6px}
 .info .btn{min-height:40px}
 .btn.wide{flex-direction:row;gap:6px}
 .btn.wide .ico{font-size:17px}
 .controls{padding:6px}
 .controls .btn{min-height:46px}
 .controls .btn .ico{font-size:18px}
}
</style>
</head>
<body>
<canvas id="space" role="img" aria-label="Układ Słoneczny. Dotknij planety, żeby się o niej czegoś dowiedzieć."></canvas>
<div class="top">
 <div class="logo">☀️</div>
 <div><h1>Mój Kosmos</h1><div class="sub">Dotknij planetę, żeby ją poznać</div></div>
 <div class="notebook" id="notebook">📓 Odkryto 0 z 0</div>
</div>
<div class="dock" id="dock">
 <section class="panel info" id="info">
  <div class="infohead">
   <div class="planet-icon" id="planetIcon"></div>
   <div class="infotext"><h2 id="planetName">Ziemia</h2><div class="muted" id="planetType"></div></div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="factbox">
   <div class="factlabel">💡 Czy wiesz, że…</div>
   <p class="fact" id="fact"></p>
   <div class="dots" id="dots"></div>
  </div>
  <div class="row facts">
   <button class="btn wide" id="nextFact"><span class="ico">💡</span>Ciekawostka</button>
   <button class="btn wide" id="readAgain"><span class="ico">🔊</span>Posłuchaj</button>
   <button class="btn wide" id="activityBtn" hidden><span class="ico">🔬</span>Zadanie</button>
  </div>
  <div class="row">
   <button class="btn" id="prev" aria-label="Poprzedni obiekt"><span class="ico">◀️</span>Wstecz</button>
   <button class="btn" id="focusBtn"><span class="ico">🔍</span>Przybliż</button>
   <button class="btn" id="resetBtn"><span class="ico">🏠</span>Cały układ</button>
   <button class="btn" id="next" aria-label="Następny obiekt"><span class="ico">▶️</span>Dalej</button>
  </div>
 </section>
 <section class="panel controls" id="controls">
  <button class="btn" data-speed="10"><span class="ico">🐢</span><span class="lbl">Wolno</span></button>
  <button class="btn active" data-speed="35"><span class="ico">🚶</span><span class="lbl">Normalnie</span></button>
  <button class="btn" data-speed="100"><span class="ico">🐇</span><span class="lbl">Szybko</span></button>
  <button class="btn" data-speed="200"><span class="ico">🚀</span><span class="lbl">Super</span></button>
  <button class="btn" id="play"><span class="ico">⏸</span><span class="lbl">Stop</span></button>
  <button class="btn" id="sound"><span class="ico">🔊</span><span class="lbl">Głos</span></button>
 </section>
</div>
<div class="activity" id="activity" hidden>
 <div class="card">
  <div class="acthead"><h2 id="actTitle"></h2><button id="actClose" aria-label="Zamknij">✖</button></div>
  <p class="actlead" id="actLead"></p>
  <canvas id="actCanvas"></canvas>
  <div class="actlog" id="actLog"></div>
 </div>
</div>
<script>
(() => {
'use strict';

const TAU = Math.PI * 2;
const MAX_ORBIT = 570;

const MAX_TILT = .95;

const MAX_ZOOM = 16;

/* ---------- dane ---------- */

const bodies = [

 {id: 'mercury', kind: 'planet', name: 'Merkury', type: 'Pierwsza planeta od Słońca', color: '#9b8d7a', radius: 4, orbit: 70, period: 88, startPhase: .8,

 {id: 'venus', kind: 'planet', name: 'Wenus', type: 'Druga planeta od Słońca', color: '#d7a75d', radius: 7, orbit: 106, period: 225, startPhase: 2.4,

 {id: 'earth', kind: 'planet', name: 'Ziemia', type: 'Trzecia planeta od Słońca', color: '#268de0', radius: 8, orbit: 145, period: 365.25, startPhase: 4.1, surface: 'earth', activity: 'moon',

 {id: 'halley', kind: 'comet', name: 'Kometa Halleya', type: 'Kometa', color: '#dff1ff', radius: 2.5, followRadius: 16, period: 27759, startAnomaly: 5.68, semiMajor: 303.5, eccentricity: .797, perihelionAngle: 2.2,

function layout() {
 const compact = compactQuery.matches;
 const free = {left: 0, top: compact ? 76 : 84, right: view.width, bottom: view.height};
 if (compact) {
  const dockRect = dock.getBoundingClientRect();
  if (dockRect.width < view.width * .7) free.right = dockRect.left - 12;
  else free.bottom = dockRect.top - 8;
 } else {
  free.right = infoPanel.getBoundingClientRect().left - 16;
  free.bottom = controlsPanel.getBoundingClientRect().top - 8;
 }
 if (free.right - free.left < 200) free.right = free.left + 200;
 if (free.bottom - free.top < 140) free.bottom = free.top + 140;
 view.free = free;
}

function defaultTilt() {
 const width = view.free.right - view.free.left;
 const height = view.free.bottom - view.free.top;
 return width / height < 1 ? .5 : .32;
}

function resize() {
 view.width = window.innerWidth;
 view.height = window.innerHeight;
 view.dpr = Math.min(window.devicePixelRatio || 1, 2);
 canvas.width = Math.round(view.width * view.dpr);
 canvas.height = Math.round(view.height * view.dpr);
 ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);

}

/* ---------- rzutowanie i kamera ---------- */

function fitScale() {
 const halfWidth = (view.free.right - view.free.left) / 2 - 10;
 const halfHeight = (view.free.bottom - view.free.top) / 2 - 10;
 const extent = MAX_ORBIT + 16;
 return Math.max(.15, Math.min(halfWidth / extent, halfHeight / (extent * view.tilt)));
}

function orbitPhase(body) {
 return body.startPhase + simDays / body.period * TAU + view.angle;
}

function cometPoint(body, eccentricAnomaly) {
 const semiMinor = body.semiMajor * Math.sqrt(1 - body.eccentricity * body.eccentricity);
 const x = body.semiMajor * (Math.cos(eccentricAnomaly) - body.eccentricity);
 const y = semiMinor * Math.sin(eccentricAnomaly);
 const rotation = body.perihelionAngle + view.angle;
 return {
  x: x * Math.cos(rotation) - y * Math.sin(rotation),
  y: x * Math.sin(rotation) + y * Math.cos(rotation),
  distance: Math.hypot(x, y)
 };
}

function cometState(body) {
 let meanAnomaly = (body.startAnomaly + simDays / body.period * TAU) % TAU;
 if (meanAnomaly > Math.PI) meanAnomaly -= TAU;
 let eccentric = meanAnomaly + body.eccentricity * Math.sin(meanAnomaly);
 for (let step = 0; step < 8; step++) {
  eccentric -= (eccentric - body.eccentricity * Math.sin(eccentric) - meanAnomaly) / (1 - body.eccentricity * Math.cos(eccentric));
 }
 return cometPoint(body, eccentric);
}

function bodyOffset(body, scaleValue) {
 if (body.kind === 'star') return {x: 0, y: 0, distance: 0};
 if (body.kind === 'comet') {
  const state = cometState(body);
  return {x: state.x * scaleValue, y: state.y * scaleValue * view.tilt, distance: state.distance};
 }
 const phase = orbitPhase(body);
 return {x: Math.cos(phase) * body.orbit * scaleValue, y: Math.sin(phase) * body.orbit * scaleValue * view.tilt, distance: body.orbit};
}

function bodyRadius(body, scaleValue) {
 return Math.max(3 + body.radius * .3, body.radius * scaleValue * 1.25);
}

function sunRadius(scaleValue) {
 return Math.max(13, bodies[0].radius * scaleValue);
}

function followTarget(scaleValue) {
 const body = bodies[view.selected];
 if (!view.following || body.kind === 'star') return {x: 0, y: 0};
 const offset = bodyOffset(body, scaleValue);
 return {x: -offset.x, y: -offset.y};
}

function computeFrame() {
 const scaleValue = fitScale() * view.zoom;
 const target = followTarget(scaleValue);
 return {
  scale: scaleValue,
  sunX: (view.free.left + view.free.right) / 2 + target.x + view.carryX,
  sunY: (view.free.top + view.free.bottom) / 2 + target.y + view.carryY
 };
}

function followZoom(index) {
 const body = bodies[index];
 const wantedRadius = body.followRadius || (compactQuery.matches ? 36 : 48);
 const unit = body.kind === 'star' ? body.radius * fitScale() : body.radius * fitScale() * 1.25;
 return clamp(wantedRadius / unit, 1.8, 14);
}

function setSelection(following, index) {
 const scaleValue = fitScale() * view.zoom;
 const before = followTarget(scaleValue);
 const panX = before.x + view.carryX;
 const panY = before.y + view.carryY;
 view.following = following;
 view.selected = index;
 const after = followTarget(scaleValue);
 view.carryX = panX - after.x;
 view.carryY = panY - after.y;
}

function updateCamera(dt) {
 const easing = 1 - Math.exp(-dt * 7);
 view.zoom = Math.exp(Math.log(view.zoom) + (Math.log(view.zoomGoal) - Math.log(view.zoom)) * easing);
 if (Math.abs(view.zoom / view.zoomGoal - 1) < .0005) view.zoom = view.zoomGoal;
 if (view.angleGoal !== null) {
  view.angle += (view.angleGoal - view.angle) * easing;
  if (Math.abs(view.angleGoal - view.angle) < .002) {view.angle = view.angleGoal; view.angleGoal = null;}
 }
 if (view.tiltGoal !== null) {
  view.tilt += (view.tiltGoal - view.tilt) * easing;
  if (Math.abs(view.tiltGoal - view.tilt) < .002) {view.tilt = view.tiltGoal; view.tiltGoal = null;}
 }
 const decay = Math.exp(-dt * 6);
 view.carryX *= decay;
 view.carryY *= decay;
}

function lighten(hex, factor) {
 const value = parseInt(hex.slice(1), 16);
 const red = Math.round(Math.min(255, ((value >> 16) & 255) * factor));
 const green = Math.round(Math.min(255, ((value >> 8) & 255) * factor));
 const blue = Math.round(Math.min(255, (value & 255) * factor));
 return `rgb(${red},${green},${blue})`;
}

function glow(x, y, radius, color) {
 const gradient = ctx.createRadialGradient(x, y, Math.max(1, radius * .2), x, y, radius * 3.8);
 gradient.addColorStop(0, color);
 gradient.addColorStop(1, 'rgba(0,0,0,0)');
 ctx.fillStyle = gradient;
 ctx.beginPath();
 ctx.arc(x, y, radius * 3.8, 0, TAU);
 ctx.fill();
}

function heartPath(centerX, centerY, size) {
 const path = new Path2D();
 path.moveTo(centerX, centerY + size * .9);
 path.bezierCurveTo(centerX - size * 1.3, centerY + size * .2, centerX - size * .9, centerY - size * .9, centerX, centerY - size * .35);
 path.bezierCurveTo(centerX + size * .9, centerY - size * .9, centerX + size * 1.3, centerY + size * .2, centerX, centerY + size * .9);
 path.closePath();
 return path;
}

function drawAsteroids(frame) {

  const y = frame.sunY + Math.sin(phase) * rock.orbit * frame.scale * view.tilt;

  ctx.globalAlpha = rock.alpha;
  ctx.beginPath();
  ctx.arc(x, y, clamp(rock.size * frame.scale * .8, .6, 3), 0, TAU);

}

function drawRing(x, y, radius, ring, half) {

  ctx.beginPath();
  ctx.ellipse(0, 0, radius * band.scale, radius * band.scale * ratio, 0, start, start + Math.PI);

 }

}

function drawComet(item, frame) {
 const {x, y, radius, distance} = item;
 const directionX = x - frame.sunX;
 const directionY = y - frame.sunY;
 const length = Math.hypot(directionX, directionY) || 1;
 const unitX = directionX / length;
 const unitY = directionY / length;
 const nucleusRadius = Math.min(radius, 5);
 const tailLength = Math.pow(Math.max(0, 1 - distance / 340), .8) * 170 * clamp(frame.scale, .5, 1.5);
 if (tailLength > 3) {
  const normalX = -unitY;
  const normalY = unitX;
  const layers = [
   {color: 'rgba(170,225,255,.65)', curve: 0, endSpread: .14},
   {color: 'rgba(255,232,180,.4)', curve: .2, endSpread: .24}
  ];
  for (const layer of layers) {
   const endX = x + unitX * tailLength + normalX * tailLength * layer.curve;
   const endY = y + unitY * tailLength + normalY * tailLength * layer.curve;
   const baseSpread = nucleusRadius * 1.1;
   const endSpread = tailLength * layer.endSpread;
   const gradient = ctx.createLinearGradient(x, y, endX, endY);
   gradient.addColorStop(0, layer.color);
   gradient.addColorStop(1, 'rgba(170,225,255,0)');
   ctx.fillStyle = gradient;
   ctx.beginPath();
   ctx.moveTo(x + normalX * baseSpread, y + normalY * baseSpread);
   ctx.quadraticCurveTo(x + unitX * tailLength * .6 + normalX * endSpread * .6, y + unitY * tailLength * .6 + normalY * endSpread * .6, endX + normalX * endSpread, endY + normalY * endSpread);
   ctx.lineTo(endX - normalX * endSpread, endY - normalY * endSpread);
   ctx.quadraticCurveTo(x + unitX * tailLength * .6 - normalX * endSpread * .6, y + unitY * tailLength * .6 - normalY * endSpread * .6, x - normalX * baseSpread, y - normalY * baseSpread);
   ctx.closePath();
   ctx.fill();

 }

 ctx.beginPath();
 ctx.arc(x, y, nucleusRadius, 0, TAU);
 ctx.fill();

}

function drawPlanet(item) {
 const {body, index, x, y, radius} = item;
 glow(x, y, radius, body.color + '35');
 if (body.ring) drawRing(x, y, radius, body.ring, 'back');
 const gradient = ctx.createRadialGradient(x - radius * .4, y - radius * .45, radius * .04, x + radius * .12, y + radius * .12, radius * 1.25);
 gradient.addColorStop(0, lighten(body.color, 1.55));
 gradient.addColorStop(.5, body.color);
 gradient.addColorStop(1, '#070b16');
 ctx.fillStyle = gradient;
 ctx.beginPath();
 ctx.arc(x, y, radius, 0, TAU);
 ctx.fill();
 ctx.save();
 ctx.beginPath();
 ctx.arc(x, y, radius, 0, TAU);
 ctx.clip();

 ctx.restore();

function drawProbe(x, y, size, angle) {
 ctx.save();
 ctx.translate(x, y);
 ctx.rotate(angle);
 ctx.fillStyle = '#3b6fd8';
 ctx.fillRect(-size * 1.7, -size * .35, size * 1.1, size * .7);
 ctx.fillRect(size * .6, -size * .35, size * 1.1, size * .7);
 ctx.strokeStyle = '#9fc0ff';
 ctx.lineWidth = 1;
 ctx.strokeRect(-size * 1.7, -size * .35, size * 1.1, size * .7);
 ctx.strokeRect(size * .6, -size * .35, size * 1.1, size * .7);
 ctx.fillStyle = '#e4c77a';
 ctx.fillRect(-size * .6, -size * .6, size * 1.2, size * 1.2);
 ctx.strokeStyle = '#8e7430';
 ctx.strokeRect(-size * .6, -size * .6, size * 1.2, size * 1.2);
 ctx.restore();
}

function drawFinds(items) {
 view.findTargets = [];
 const parent = items[view.selected];
 if (!parent) return;
 const threshold = parent.body.kind === 'star' ? 30 : 16;
 if (parent.radius < threshold) return;
 finds.filter(find => find.parentId === parent.body.id).forEach((find, order) => {
  const orbitX = parent.radius * 1.9 + 10;
  const orbitY = orbitX * .55;
  const angle = frameTime * .0005 + order * 2.1;
  const x = parent.x + Math.cos(angle) * orbitX;
  const y = parent.y + Math.sin(angle) * orbitY;
  ctx.strokeStyle = 'rgba(255,217,90,.25)';
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 5]);
  ctx.beginPath();
  ctx.ellipse(parent.x, parent.y, orbitX, orbitY, 0, 0, TAU);
  ctx.stroke();
  ctx.setLineDash([]);
  const size = clamp(parent.radius * .16, 5, 9);
  if (!discovered.has(find.id)) {
   const pulse = Math.sin(frameTime * .004) * .5 + .5;
   ctx.strokeStyle = `rgba(255,226,110,${.3 + .5 * pulse})`;
   ctx.lineWidth = 2;
   ctx.beginPath();
   ctx.arc(x, y, size * 2.4 + pulse * 3, 0, TAU);
   ctx.stroke();
  }
  drawProbe(x, y, size, angle + Math.PI / 2);
  view.findTargets.push({find, x, y, radius: size * 2.4});
 });
}

function drawLabels(items) {
 const fontSize = compactQuery.matches ? 12 : 14;
 const placed = [];
 const ordered = [...items].sort((a, b) => (b.index === view.selected) - (a.index === view.selected));
 ctx.textAlign = 'center';
 ctx.textBaseline = 'alphabetic';
 for (const item of ordered) {
  const isSelected = item.index === view.selected;
  ctx.font = `${isSelected ? 800 : 700} ${fontSize}px ui-rounded, system-ui, sans-serif`;
  const width = ctx.measureText(item.body.name).width;
  const labelY = item.y - item.radius - (isSelected ? 18 : 12);
  const box = {left: item.x - width / 2 - 3, right: item.x + width / 2 + 3, top: labelY - fontSize, bottom: labelY + 3};
  const collides = placed.some(other => box.left < other.right && box.right > other.left && box.top < other.bottom && box.bottom > other.top);
  if (collides && !isSelected) continue;
  placed.push(box);
  ctx.fillStyle = isSelected ? '#ffe58a' : '#e6f1ff';
  ctx.fillText(item.body.name, item.x, labelY);
 }
}

function drawRipples() {
 for (const ripple of ripples) {
  const progress = ripple.life / ripple.max;
  ctx.globalAlpha = clamp(1 - progress, 0, 1) * .8;
  ctx.strokeStyle = '#ffe58a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(ripple.x, ripple.y, ripple.radius + progress * 46, 0, TAU);
  ctx.stroke();
 }
 ctx.globalAlpha = 1;
}

function draw() {
 const frame = computeFrame();
 drawBackground();
 drawOrbits(frame);
 drawAsteroids(frame);
 const items = [];
 bodies.forEach((body, index) => {
  if (body.kind === 'star') {items.push(null); return;}
  const offset = bodyOffset(body, frame.scale);
  items.push({body, index, x: frame.sunX + offset.x, y: frame.sunY + offset.y, radius: bodyRadius(body, frame.scale), distance: offset.distance});
 });
 const planetItems = items.filter(Boolean);
 view.targets = planetItems;
 const behind = planetItems.filter(item => item.y < frame.sunY).sort((a, b) => a.y - b.y);
 const inFront = planetItems.filter(item => item.y >= frame.sunY).sort((a, b) => a.y - b.y);
 const paint = item => item.body.kind === 'comet' ? drawComet(item, frame) : drawPlanet(item);
 behind.forEach(paint);
 drawSun(frame);
 inFront.forEach(paint);
 items[0] = view.sunTarget;
 drawFinds(items);
 drawLabels(items);
 drawRipples();
}

function pickAt(clientX, clientY, pointerType) {
 const padding = pointerType === 'mouse' ? 10 : 22;
 for (const target of view.findTargets) {
  if (Math.hypot(target.x - clientX, target.y - clientY) <= target.radius + padding * .5) {
   chooseFind(target);

  const distance = Math.hypot(target.x - clientX, target.y - clientY);
  if (distance > Math.max(16, target.radius + padding)) continue;
  const rank = distance - target.radius;
  if (rank < bestRank) {bestRank = rank; bestIndex = target.index;}
 }
 if (bestIndex === null && view.sunTarget && Math.hypot(view.sunTarget.x - clientX, view.sunTarget.y - clientY) <= view.sunTarget.radius + 8) bestIndex = 0;
 if (bestIndex !== null) choose(bestIndex);
}

const pointers = new Map();
let gesture = null;

function pointerDistance() {
 const [first, second] = [...pointers.values()];
 return Math.hypot(first.x - second.x, first.y - second.y) || 1;
}

canvas.addEventListener('pointerdown', event => {
 try {canvas.setPointerCapture(event.pointerId);} catch (error) {}
 pointers.set(event.pointerId, {x: event.clientX, y: event.clientY});
 if (pointers.size === 1) {
  gesture = {kind: 'drag', startX: event.clientX, startY: event.clientY, angle: view.angle, tilt: view.tilt, moved: false};
 } else if (pointers.size === 2) {
  gesture = {kind: 'pinch', startDistance: pointerDistance(), startZoom: view.zoomGoal};
 }
});

canvas.addEventListener('pointermove', event => {
 if (!pointers.has(event.pointerId)) return;
 pointers.set(event.pointerId, {x: event.clientX, y: event.clientY});
 if (!gesture) return;
 if (gesture.kind === 'pinch') {
  if (pointers.size >= 2) {
   view.zoomGoal = clamp(gesture.startZoom * pointerDistance() / gesture.startDistance, MIN_ZOOM, MAX_ZOOM);
   view.zoom = view.zoomGoal;
  }
  return;
 }
 const deltaX = event.clientX - gesture.startX;
 const deltaY = event.clientY - gesture.startY;
 if (!gesture.moved && Math.abs(deltaX) + Math.abs(deltaY) > 8) gesture.moved = true;
 if (!gesture.moved) return;
 view.angleGoal = null;
 view.tiltGoal = null;
 view.angle = gesture.angle - deltaX * .006;
 view.tilt = clamp(gesture.tilt + deltaY * .003, MIN_TILT, MAX_TILT);
});

function endPointer(event) {
 if (!pointers.has(event.pointerId)) return;
 const finished = gesture;
 pointers.delete(event.pointerId);
 if (finished && finished.kind === 'drag' && !finished.moved && event.type === 'pointerup') pickAt(event.clientX, event.clientY, event.pointerType);
 gesture = null;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

canvas.addEventListener('wheel', event => {
 event.preventDefault();
 const delta = event.deltaMode === 1 ? event.deltaY * 33 : event.deltaY;
 view.zoomGoal = clamp(view.zoomGoal * Math.exp(-delta * .0015), MIN_ZOOM, MAX_ZOOM);
}, {passive: false});

  if (actCtx.isPointInPath(heart, point.x * ACT_SCALE, point.y * ACT_SCALE)) {

   render();
   logActivity('Znalazłaś serce Plutona! To jasna równina Tombaugh Regio. Zdjęcia zrobiła sonda New Horizons w lipcu 2015 roku. Lewa część serca to wielka równina z zamarzniętego azotu. Azot to gaz, który jest też w naszym powietrzu, tylko na Plutonie jest tak zimno, że zamarzł.');
  }
 };
 return {
  title: '💗 Znajdź serce Plutona',
  lead: 'Na Plutonie jest bardzo ciemno. Poruszaj palcem, żeby oświetlać powierzchnię, i znajdź wielkie serce.',
  width, height,
  start: render,
  onDown: move,
  onMove: move,
  onUp: () => {}
 };
}

 {id: 'steps', shape: 'circle', x: 168, y: 172, r: 50, text: 'Ślady butów. Na Księżycu nie ma wiatru ani deszczu, więc ślady astronautów mogą zostać tam bardzo, bardzo długo.'},
 {id: 'crater', shape: 'circle', x: 445, y: 178, r: 38, text: 'Krater. To ślad po uderzeniu meteorytu. Na Księżycu jest ich mnóstwo, bo nie ma atmosfery, która spaliłaby meteory.'},
 {id: 'sky', shape: 'sky', text: 'Niebo. Na Księżycu niebo jest czarne nawet w dzień, bo nie ma atmosfery, która rozprasza światło. Na Ziemi dlatego niebo jest niebieskie.'}

  [[40, 30], [120, 70], [200, 25], [270, 60], [390, 20], [520, 80], [90, 100], [430, 90], [300, 15], [560, 40]].forEach(([x, y]) => c.fillRect(x, y, 2, 2));

 const ground = c.createLinearGradient(0, 128, 0, 200);
 ground.addColorStop(0, '#9a9aa2');

 };
 crater(90, 172, 34, 9);
 crater(360, 184, 44, 11);
 crater(520, 160, 24, 7);
 if (original) crater(445, 178, 36, 10);

 [[60, 137, 40, 160], [100, 137, 122, 160], [80, 137, 80, 160]].forEach(([fromX, fromY, toX, toY]) => {

 });
 c.fillStyle = '#9a9aa4';
 c.fillRect(212, 110, 10, 28);

 c.fillStyle = '#f4f4f8';

 const visor = c.createLinearGradient(225, 86, 245, 102);
 visor.addColorStop(0, '#f6d77a');

 c.fillStyle = visor;
 c.beginPath();

 if (original) {

function createMoonActivity() {
 const width = 560;
 const height = 412;
 const found = new Set();
 const scene = makeLayer(width, height);
 drawMoonScene(scene.ctx, 0, true);
 drawMoonScene(scene.ctx, 212, false);
 scene.ctx.fillStyle = '#020611';
 scene.ctx.fillRect(0, 200, width, 12);
 const marks = diff => {
  actCtx.strokeStyle = '#ffd95a';
  actCtx.lineWidth = 4;
  [0, 212].forEach(offsetY => {
   actCtx.beginPath();
   if (diff.shape === 'circle') actCtx.arc(diff.x, diff.y + offsetY, diff.r, 0, TAU);
   else actCtx.rect(6, offsetY + 6, 548, 90);
   actCtx.stroke();
  });
 };
 const render = () => {
  actCtx.drawImage(scene.canvas, 0, 0, width, height);
  actCtx.font = '700 14px system-ui, sans-serif';
  actCtx.fillStyle = 'rgba(0,0,0,.55)';
  actCtx.fillRect(8, 172, 78, 22);
  actCtx.fillRect(8, 384, 78, 22);
  actCtx.fillStyle = '#fff';
  actCtx.fillText('Obrazek 1', 14, 188);
  actCtx.fillText('Obrazek 2', 14, 400);
  MOON_DIFFS.filter(diff => found.has(diff.id)).forEach(marks);
 };
 const tap = point => {
  if (point.y > 200 && point.y < 212) return;
  const localY = point.y >= 212 ? point.y - 212 : point.y;
  const hit = MOON_DIFFS.find(diff => {
   if (diff.shape === 'circle') return Math.hypot(point.x - diff.x, localY - diff.y) <= diff.r;
   return localY < 105;
  });
  if (!hit || found.has(hit.id)) return;
  found.add(hit.id);
  render();
  const summary = found.size === MOON_DIFFS.length ? ' Znalazłaś wszystkie różnice! Prawdziwy Księżyc wygląda jak Obrazek 1.' : '';
  logActivity(`Znaleziono ${found.size} z ${MOON_DIFFS.length}. ${hit.text}${summary}`);
 };
 return {
  title: '🌙 Księżyc: znajdź 5 różnic',
  lead: 'Te dwa obrazki różnią się pięcioma szczegółami. Dotknij miejsca, w którym coś się nie zgadza. Obrazek 1 pokazuje prawdziwy Księżyc.',
  width, height,
  start: render,
  onDown: tap,
  onMove: () => {},
  onUp: () => {}
 };
}

const activityFactories = {moon: createMoonActivity, rover: createRoverActivity, heart: createHeartActivity};

function activityPoint(event) {
 const rect = actCanvas.getBoundingClientRect();
 return {
  x: (event.clientX - rect.left) * activeActivity.width / rect.width,
  y: (event.clientY - rect.top) * activeActivity.height / rect.height
 };
}

function openActivity(kind) {
 const factory = activityFactories[kind];
 if (!factory) return;
 if (speechSupported) window.speechSynthesis.cancel();
 activeActivity = factory();
 byId('actTitle').textContent = activeActivity.title;
 byId('actLead').textContent = activeActivity.lead;
 byId('actLog').innerHTML = '';
 actCanvas.width = activeActivity.width * ACT_SCALE;
 actCanvas.height = activeActivity.height * ACT_SCALE;
 actCtx.setTransform(ACT_SCALE, 0, 0, ACT_SCALE, 0, 0);
 activityOverlay.hidden = false;
 activityOverlay.scrollTop = 0;
 activeActivity.start();
}

function closeActivity() {
 activeActivity = null;
 activityOverlay.hidden = true;
 if (speechSupported) window.speechSynthesis.cancel();
}

actCanvas.addEventListener('pointerdown', event => {
 if (!activeActivity) return;
 try {actCanvas.setPointerCapture(event.pointerId);} catch (error) {}
 activeActivity.onDown(activityPoint(event));
});
actCanvas.addEventListener('pointermove', event => {
 if (activeActivity) activeActivity.onMove(activityPoint(event));
});
actCanvas.addEventListener('pointerup', () => {
 if (activeActivity) activeActivity.onUp();
});
actCanvas.addEventListener('pointercancel', () => {
 if (activeActivity) activeActivity.onUp();
});
byId('actClose').addEventListener('click', closeActivity);

/* ---------- sterowanie ---------- */

document.querySelectorAll('[data-speed]').forEach(button => button.addEventListener('click', () => applySpeed(+button.dataset.speed)));
byId('play').addEventListener('click', togglePlay);
byId('sound').addEventListener('click', toggleSound);
byId('prev').addEventListener('click', () => choose(view.selected - 1));
byId('next').addEventListener('click', () => choose(view.selected + 1));
byId('nextFact').addEventListener('click', nextFact);
byId('readAgain').addEventListener('click', () => speakItem(true));
byId('focusBtn').addEventListener('click', focusSelected);
byId('resetBtn').addEventListener('click', resetView);
byId('activityBtn').addEventListener('click', () => openActivity(bodies[view.selected].activity));

window.addEventListener('keydown', event => {
 const target = event.target;
 if (!activityOverlay.hidden) {
  if (event.key === 'Escape') closeActivity();
  return;
 }
 if (event.key === 'ArrowRight') choose(view.selected + 1);
 else if (event.key === 'ArrowLeft') choose(view.selected - 1);
 else if (event.key === 'Escape') resetView();
 else if (event.key === ' ' && !(target && target.closest && target.closest('button'))) {
  event.preventDefault();
  togglePlay();
 }
});

window.addEventListener('resize', resize);
if ('ResizeObserver' in window) {
 const observer = new ResizeObserver(layout);
 observer.observe(infoPanel);
 observer.observe(dock);
}
if (speechSupported) window.speechSynthesis.getVoices();
else {
 byId('readAgain').hidden = true;
 byId('sound').hidden = true;
}

/* ---------- pętla ---------- */

function frameLoop(now) {
 const dt = clamp((now - lastFrameTime) / 1000, 0, .1);
 lastFrameTime = now;
 frameTime = now;
 if (playing && speed > 0) simDays += dt * speed * DAYS_PER_SPEED_UNIT;
 updateCamera(dt);
 for (let index = ripples.length - 1; index >= 0; index--) {
  ripples[index].life += dt;
  if (ripples[index].life >= ripples[index].max) ripples.splice(index, 1);
 }
 draw();
 requestAnimationFrame(frameLoop);
}

resize();
view.tilt = defaultTilt();
renderInfo();
renderNotebook();
renderControls();
requestAnimationFrame(frameLoop);
})();
</script>
