<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#020611">
<title>Mój Kosmos</title>
<style>
:root{color-scheme:dark;--blue:#40b8ff;--gold:#ffd95a;--panel:rgba(5,16,36,.92);--line:rgba(110,180,255,.38);--green:#7ee787}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020611;color:#f2f8ff;font-family:ui-rounded,"Nunito","Baloo 2",Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none}
canvas{display:block}
#space{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:pointer}
.top{position:absolute;top:16px;left:18px;display:flex;align-items:center;gap:12px;pointer-events:none;text-shadow:0 2px 18px #000}
.logo{width:50px;height:50px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-size:28px;box-shadow:0 0 24px #ffb43a66;flex:none}
h1{font-size:clamp(22px,2.6vw,30px);margin:0;font-weight:800;letter-spacing:-.3px;line-height:1.1}
.sub{font-size:14px;color:#ffe9a8;margin-top:3px;font-weight:600}
.notebook{margin-left:8px;padding:8px 14px;border-radius:999px;background:rgba(5,16,36,.88);border:1px solid var(--line);color:#cfe6ff;font-weight:700;font-size:15px;white-space:nowrap;text-shadow:none}
.top .notebook{pointer-events:auto;cursor:pointer}
.top .notebook:hover{border-color:var(--blue)}
#taskbook{color:var(--gold)}
.gear{pointer-events:auto;width:46px;height:46px;flex:none;margin-left:4px;padding:0;border-radius:50%;font-size:22px;display:grid;place-items:center}
.panel{position:absolute;background:var(--panel);border:1px solid var(--line);box-shadow:0 14px 50px #0009,inset 0 1px #ffffff10;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:22px}
.dock{display:contents}
.info{right:18px;top:18px;width:min(380px,calc(100vw - 36px));padding:18px;max-height:calc(100vh - 130px);overflow:auto}
.infohead{display:flex;align-items:center;gap:14px}
.planet-icon{width:64px;height:64px;border-radius:50%;flex:none;box-shadow:inset -10px -6px 14px #0009,0 0 20px #ffb43a33;display:grid;place-items:center;font-size:30px}
.infotext{min-width:0}
.info h2{font-size:28px;margin:0;line-height:1.1;font-weight:800}
.muted{color:#b9d0ee;font-size:14px;margin-top:3px}
.factbox{margin-top:14px;padding:14px 16px;border-radius:18px;background:linear-gradient(160deg,#112d55,#0a1c38);border:1px solid #2f6aa8}
.factlabel{font-size:13px;color:var(--gold);font-weight:800;margin-bottom:6px}
.fact{font-size:19px;line-height:1.4;font-weight:700;margin:0;min-height:calc(1.4em * 5)}
.fact .s{transition:color .15s}
.fact .s.now{color:var(--gold)}
.fact .s.big{font-size:21px}
.fact.pop{animation:pop .35s}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.info.idle .factbox{opacity:.55}
.dots{display:flex;gap:6px;margin-top:10px}
.dot{width:16px;height:16px;min-height:0;padding:0;border-radius:50%;background:#2d4f78;border:2px solid #3a78b8;flex:none}
.dot.on{background:var(--gold);border-color:var(--gold)}
.row{display:flex;gap:8px;margin-top:12px}
button{font:inherit;color:#f2f8ff;border:2px solid #3a78b8;background:#08203c;border-radius:16px;cursor:pointer;transition:.12s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:hover{border-color:var(--blue);background:#0c335c}
button:active{transform:scale(.96)}
button.active{background:#0b4a80;border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,217,90,.3)}
.btn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;padding:6px 8px;font-size:13px;font-weight:700;line-height:1.15}
.btn .ico{font-size:24px;line-height:1}
.btn.wide{flex-direction:row;gap:8px;font-size:15px}
.btn.wide .ico{font-size:21px}
.controls{left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:24px}
.speedbox{display:flex;align-items:center;gap:10px}
.speedbox input[type=range]{width:200px;accent-color:var(--gold)}
.speedico{font-size:20px;line-height:1}
.controls .btn{width:88px;flex:none}
.homebtn{position:absolute;left:18px;bottom:18px;z-index:5;font-size:15px}
.homebtn .ico{font-size:21px}
@media (min-width:1201px){.info #resetBtn{display:none}}
@media (max-width:1200px){.homebtn{display:none}}
.activity{position:fixed;inset:0;background:rgba(2,6,17,.82);z-index:20;overflow:auto;padding:16px;display:grid;align-items:start;justify-items:center}
.activity .card{width:min(620px,100%);margin:auto;padding:16px;border-radius:24px;background:linear-gradient(160deg,#102a52,#0a1c38);border:2px solid #2f6aa8;box-shadow:0 0 60px #000}
.acthead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.acthead h2{margin:0;font-size:24px}
.actbtns{display:flex;align-items:center;gap:8px;flex:none}
.actbtns button{width:48px;height:48px;font-size:20px;padding:0;flex:none}
.actdone{color:var(--gold);font-weight:800;font-size:15px;white-space:nowrap}
#actSay.done{border-color:var(--green)}
.actlead{margin:10px 0 12px;font-size:17px;line-height:1.4;font-weight:600;color:#d8e8ff}
#actCanvas{width:auto;height:auto;max-width:100%;max-height:calc(100vh - 260px);margin:0 auto;border-radius:16px;touch-action:none;background:#000;cursor:crosshair}
.actlog{margin-top:12px}
.actlog p{margin:0 0 10px;padding:10px 14px;border-radius:14px;background:#0b2a4d;border:1px solid #2f6aa8;font-size:16px;line-height:1.4;font-weight:600;animation:pop .35s}
.settings{position:fixed;inset:0;background:rgba(2,6,17,.85);z-index:30;overflow:auto;padding:16px;display:grid;align-items:start;justify-items:center}
.settings .card{width:min(520px,100%);margin:auto;padding:18px;border-radius:24px;background:linear-gradient(160deg,#102a52,#0a1c38);border:2px solid #2f6aa8;box-shadow:0 0 60px #000}
.settings h2{margin:0;font-size:22px}
.setrow{margin-top:14px;display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:15px}
.setrow.inline{flex-direction:row;align-items:center;gap:10px}
.settings select{width:100%;padding:10px;border-radius:12px;border:2px solid #3a78b8;background:#08203c;color:#f2f8ff;font:inherit;font-weight:700}
.settings input[type=range]{width:100%;accent-color:var(--gold)}
.settings input[type=checkbox]{width:22px;height:22px;accent-color:var(--gold);flex:none}
.setinfo{font-size:14px;color:#b9d0ee;margin:8px 0 0;min-height:1.2em;line-height:1.4}
.settings .row{margin-top:16px}
.lists{position:fixed;inset:0;background:rgba(2,6,17,.85);z-index:30;overflow:auto;padding:16px;display:grid;align-items:start;justify-items:center}
.lists .card{width:min(760px,100%);margin:auto;padding:18px;border-radius:24px;background:linear-gradient(160deg,#102a52,#0a1c38);border:2px solid #2f6aa8;box-shadow:0 0 60px #000}
.lists h2{margin:0;font-size:22px}
.listsgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
.listcol h3{margin:0 0 8px;font-size:17px;color:var(--gold)}
.listitem{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:12px;margin-bottom:6px;background:#0b2a4d;border:1px solid #2f6aa8;font-weight:700;font-size:16px}
.listitem .listico{font-size:20px;flex:none}
.listitem .listlabel{flex:1;min-width:0}
.listitem .listcheck{color:var(--green);font-weight:800;flex:none;visibility:hidden}
.listitem.done .listcheck{visibility:visible}
.listitem.locked{position:relative;border-color:transparent;color:rgba(255,255,255,.92);overflow:hidden;background:radial-gradient(circle at 20% 30%,rgba(140,70,220,.9),transparent 55%),radial-gradient(circle at 75% 65%,rgba(50,130,230,.9),transparent 50%),radial-gradient(circle at 45% 85%,rgba(220,90,190,.7),transparent 55%),#141034;background-size:220% 220%,220% 220%,220% 220%;animation:nebulaShift 7s ease-in-out infinite}
@keyframes nebulaShift{0%,100%{background-position:0% 0%,0% 0%,0% 0%}50%{background-position:40% 30%,-30% 40%,25% -20%}}
.start{position:fixed;inset:0;z-index:40;background:radial-gradient(circle at 50% 38%,#14305c,#020611 72%);display:grid;place-items:center;padding:24px;text-align:center}
.startcard{max-width:430px}
.startlogo{font-size:88px;line-height:1;filter:drop-shadow(0 0 30px #ffb43a88)}
.startcard h1{font-size:46px;margin:14px 0 10px}
.startcard p{font-size:18px;line-height:1.55;color:#cfe0f5;font-weight:600;margin:0}
#startButton{margin-top:22px;font-size:24px;font-weight:800;padding:16px 40px;border-radius:999px;border-color:var(--gold);background:#0b4a80}

@media (max-width:1200px){
 .top{top:12px;left:14px;right:14px}
 .logo{width:40px;height:40px;font-size:22px}
 h1{font-size:21px}
 .sub{font-size:12px}
 .notebook{font-size:12px;padding:5px 10px;margin-left:4px}
 .gear{width:38px;height:38px;font-size:18px}
 .dock{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"info" "controls";gap:8px;pointer-events:none}
 .dock>.panel{position:static;transform:none;width:auto;pointer-events:auto}
 .info{grid-area:info;padding:12px;max-height:none;border-radius:20px}
 .planet-icon{width:48px;height:48px;font-size:24px}
 .info h2{font-size:22px}
 .muted{font-size:12px}
 .factbox{margin-top:10px;padding:10px 12px}
 .factlabel{font-size:12px;margin-bottom:4px}
 .fact{font-size:16px;min-height:calc(1.4em * 4)}
 .dots{display:none}
 .row{margin-top:8px}
 .btn{min-height:50px;font-size:12px}
 .btn.wide{flex-direction:column;font-size:12px;gap:2px;padding:4px}
 .btn.wide .ico{font-size:20px}
 .controls{grid-area:controls;display:flex;align-items:center;gap:8px;padding:8px;border-radius:20px}
 .speedbox{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
 .speedbox input[type=range]{flex:1;min-width:0;width:auto}
 .speedbox .speedico{font-size:16px}
 .controls .btn{width:auto;min-height:54px;padding:4px 14px;font-size:12px;flex:none}
 .controls .btn .ico{font-size:22px}
}
@media (max-width:700px){.listsgrid{grid-template-columns:1fr}}
@media (max-width:1200px) and (max-height:520px) and (orientation:landscape){
 .dock{left:auto;width:min(400px,52vw);top:10px;align-content:end}
 .info{max-height:calc(100vh - 92px);overflow:auto;padding:8px 12px}
 .planet-icon{width:34px;height:34px;font-size:18px}
 .info h2{font-size:19px}
 .muted{font-size:11px}
 .factbox{margin-top:6px;padding:8px 12px}
 .factlabel{margin-bottom:2px}
 .fact{font-size:14px;min-height:calc(1.35em * 3)}
 .row{margin-top:6px}
 .info .btn{min-height:40px}
 .btn.wide{flex-direction:row;gap:6px}
 .btn.wide .ico{font-size:17px}
 .controls{padding:6px}
 .controls .btn{min-height:46px}
 .controls .btn .ico{font-size:18px}
}
</style>
</head>
<body>
<canvas id="space" role="img" aria-label="Układ Słoneczny. Dotknij planetę, żeby się o niej czegoś dowiedzieć."></canvas>
<div class="top">
 <div class="logo">☀️</div>
 <div><h1>Mój Kosmos</h1><div class="sub">Dotknij planetę, żeby ją poznać</div></div>
 <div class="notebook" id="notebook">📓 Odkryto 0 z 0</div>
 <div class="notebook" id="taskbook">⭐ Zadania 0 z 0</div>
 <button class="gear" id="gear" aria-label="Ustawienia">⚙️</button>
</div>
<div class="dock" id="dock">
 <section class="panel info" id="info">
  <div class="infohead">
   <div class="planet-icon" id="planetIcon"></div>
   <div class="infotext"><h2 id="planetName">Mój Kosmos</h2><div class="muted" id="planetType"></div></div>
  </div>
  <div class="factbox">
   <div class="factlabel">💡 Czy wiesz, że…</div>
   <p class="fact" id="fact"></p>
   <div class="dots" id="dots"></div>
  </div>
  <div class="row">
   <button class="btn wide" id="readAgain"><span class="ico">🔊</span><span class="lbl">Jeszcze raz</span></button>
   <button class="btn wide" id="activityBtn" hidden><span class="ico">🔬</span><span class="lbl">Zadanie</span></button>
  </div>
  <div class="row">
   <button class="btn wide" id="resetBtn" data-home><span class="ico">🏠</span><span class="lbl">Cały układ</span></button>
  </div>
 </section>
 <section class="panel controls" id="controls">
  <div class="speedbox">
   <span class="speedico">🐢</span>
   <input type="range" id="speedRange" min="1" max="30" step="1" value="5" aria-label="Prędkość czasu">
   <span class="speedico">🚀</span>
  </div>
  <button class="btn" id="play"><span class="ico">⏸</span><span class="lbl">Stop</span></button>
  <button class="btn" id="zoomOutBtn" aria-label="Oddal widok"><span class="ico">➖</span><span class="lbl">Dalej</span></button>
  <button class="btn" id="zoomInBtn" aria-label="Przybliż widok" hidden><span class="ico">➕</span><span class="lbl">Bliżej</span></button>
 </section>
</div>
<button class="btn wide homebtn" data-home aria-label="Pokaż cały układ"><span class="ico">🏠</span><span class="lbl">Cały układ</span></button>
<div class="activity" id="activity" hidden>
 <div class="card">
  <div class="acthead">
   <h2 id="actTitle"></h2>
   <div class="actbtns">
    <span class="actdone" id="actDone" hidden>⭐ Zrobione</span>
    <button id="actSay" aria-label="Powtórz instrukcję">🔁</button>
    <button id="actClose" aria-label="Zamknij">✖</button>
   </div>
  </div>
  <p class="actlead" id="actLead"></p>
  <canvas id="actCanvas"></canvas>
  <div class="actlog" id="actLog"></div>
 </div>
</div>
<div class="lists" id="lists" hidden>
 <div class="card">
  <div class="acthead"><h2>📓⭐ Mój postęp</h2><button id="listsClose" aria-label="Zamknij">✖</button></div>
  <div class="listsgrid">
   <div class="listcol"><h3>📓 Odkrycia</h3><div id="discoverList"></div></div>
   <div class="listcol"><h3>⭐ Zadania</h3><div id="taskList"></div></div>
  </div>
 </div>
</div>
<div class="settings" id="settings" hidden>
 <div class="card">
  <div class="acthead"><h2>⚙️ Ustawienia</h2><button id="settingsClose" aria-label="Zamknij">✖</button></div>
  <div class="setrow"><label for="voiceSelect">Głos lektora</label><select id="voiceSelect"></select></div>
  <p class="setinfo" id="voiceInfo"></p>
  <div class="setrow"><label for="rateRange">Tempo mowy</label><input type="range" id="rateRange" min="0.6" max="1.3" step="0.05"></div>
  <div class="setrow"><label for="pitchRange">Wysokość głosu</label><input type="range" id="pitchRange" min="0.7" max="1.5" step="0.05"></div>
  <div class="setrow inline"><input type="checkbox" id="soundToggle" checked><label for="soundToggle">Czytanie na głos włączone</label></div>
  <div class="setrow inline"><input type="checkbox" id="fxToggle" checked><label for="fxToggle">Dźwięki (pikanie, fanfary) włączone</label></div>
  <div class="setrow inline"><input type="checkbox" id="musicToggle" checked><label for="musicToggle">🎵 Muzyczka w tle włączona</label></div>
  <div class="row">
   <button class="btn wide" id="voiceTest"><span class="ico">🔊</span><span class="lbl">Przetestuj głos</span></button>
   <button class="btn wide" id="resetNotebook"><span class="ico">🗑️</span><span class="lbl">Wyczyść odkrycia</span></button>
  </div>
 </div>
</div>
<div class="start" id="start">
 <div class="startcard">
  <div class="startlogo">🚀</div>
  <h1>Mój Kosmos</h1>
  <p>Dotknij planetę, Słońce albo kometę. Każda ma dla Ciebie ciekawostki i zadanie!</p>
  <button id="startButton">Zaczynamy! ✨</button>
 </div>
</div>
<script>
(() => {
'use strict';
